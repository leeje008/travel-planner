# CD 파이프라인 — 서버 정보 확정 후 활성화
#
# 필요한 GitHub Secrets:
#   SERVER_SSH_KEY      — 배포 서버 SSH 프라이빗 키
#   SERVER_HOST         — 배포 서버 IP/호스트
#   SERVER_USER         — SSH 접속 사용자 (예: ubuntu)
#   SERVER_PROJECT_PATH — 서버 내 프로젝트 경로

name: Deploy

on:
  push:
    branches: [develop-deploy]

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check api/ core/

      - name: Test (pytest)
        run: uv run pytest -v --tb=short

  deploy:
    needs: lint_and_test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

