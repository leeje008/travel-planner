[project]
name = "travel-planner"
version = "0.1.0"
description = "AI Travel Planner - 최적 동선 + POI 추천 + LLM 패키지 생성"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=21.2.0",
    # LLM
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3",
    "alembic>=1.14",
    # Routing
    "ortools>=9.10",
    # HTTP
    "httpx>=0.28",
    # Cache
    "redis>=5.0",
    # Geo
    "shapely>=2.0",
    "polyline>=2.0",
    # Frontend (MVP)
    "streamlit>=1.40",
    "folium>=0.18",
    "streamlit-folium>=0.23",
    # Utils
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1.0",
    "ruff>=0.8",
    "httpx",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["api", "app", "core", "etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
